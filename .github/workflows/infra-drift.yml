##############################################################################
# infra-drift — scheduled `terraform plan` (§15 guardrail 5).
#
# Nothing in this project is supposed to be clicked in the console, but the
# only way to know that held is to ask. A monthly plan that should be empty is
# the cheapest possible drift detector: if it reports changes, either someone
# edited something by hand or AWS changed a default underneath us.
#
# Runs read-only. It never applies.
##############################################################################

name: infra-drift

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-drift
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  drift:
    name: drift (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: infra-plan

    permissions:
      contents: read
      id-token: write
      issues: write # to raise a drift report

    strategy:
      fail-fast: false
      matrix:
        env: [shared, staging, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-drift-${{ matrix.env }}-${{ github.run_id }}

      - name: terraform init
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # The distinction is the whole point — a non-empty plan is a finding, not
      # a failure, and needs a different response from a broken config.
      - name: terraform plan
        id: plan
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -no-color > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          if [ "$code" = "1" ]; then
            echo "::error::plan failed for ${{ matrix.env }}"
            exit 1
          fi

      - name: Report drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          TARGET_ENV: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const targetEnv = process.env.TARGET_ENV;
            const title = `Infrastructure drift detected in ${targetEnv}`;

            let plan = '(plan output unavailable)';
            try {
              plan = fs.readFileSync(`infra/envs/${targetEnv}/plan.txt`, 'utf8').slice(0, 50000);
            } catch (err) {
              core.warning(err.message);
            }

            const body = [
              `The scheduled plan for \`${targetEnv}\` is not empty, so the live account no longer matches this repository.`,
              '',
              'Either revert the console change, or bring it into code and apply.',
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '<details><summary>Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;

            // Reuse the open issue for this environment rather than filing a
            // new one every month.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'drift',
            });
            const match = existing.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['drift'],
              });
            }

      - name: Summary
        if: always()
        env:
          TARGET_ENV: ${{ matrix.env }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            if [ "${EXIT_CODE}" = "0" ]; then
              echo "### ${TARGET_ENV}: no drift"
            else
              echo "### ${TARGET_ENV}: drift detected (plan exit ${EXIT_CODE})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
